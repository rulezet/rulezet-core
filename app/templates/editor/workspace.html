{% extends 'base.html' %}
{% block title %}Editor — RULEZET{% endblock %}
{% block head %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/components/theme-bridge.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/bundle/bundle-editor.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/editor/editor-ui.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/editor/workspace.css') }}">
{% endblock %}
{% block content %}
<div id="editor-workspace-app" class="container-fluid px-3 pt-3" v-cloak>
  <editor-workspace
    csrf-token="{{ csrf_token() }}"
    author="{{ current_user.get_username() }}"
    :bundle-id="{{ bundle_id | tojson }}"
    :show-scenarios="{{ show_scenarios | tojson }}"></editor-workspace>
</div>
{% endblock %}
{% block script %}
<script src="{{ url_for('static', filename='js/bundle/jsdelivr_sortablejs.js') }}"></script>
<script src="{{ url_for('static', filename='js/bundle/jsdelivr_vuedraggable.js') }}"></script>
<script type="module">
import EditorWorkspace from '/static/js/editor/EditorWorkspace.js'
const app = Vue.createApp({ delimiters: ['[[', ']]'] })
app.component('editor-workspace', EditorWorkspace)
app.mount('#editor-workspace-app')
</script>
{% endblock %}
