name: Python application

on:
  push:
   branches:
      - '*'

# The job only checks out the code and runs the tests — a read-only token.
permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v2
      with:
        submodules: recursive
    - name: Set up uv (and Python 3.12)
      uses: astral-sh/setup-uv@v6
      with:
        python-version: "3.12"
    - name: Install dependencies
      # --locked: fail if uv.lock is out of date with pyproject.toml (run `uv lock` and commit it)
      run: |
        uv sync --locked
    - name: Test
      run: |
        source .venv/bin/activate
        ./launch.sh -t
    - name: Test (new suite, tests_new/)
      if: ${{ !cancelled() }}
      run: |
        source .venv/bin/activate
        FLASKENV=testing pytest tests_new
