# Rulezet — "being updated" page (deploy/nginx/maintenance.html), included in the server block.
# Installed by deploy/nginx_switch.sh (on / maintenance-install) into /etc/nginx/snippets/.
#
#  - Rulezet not answering (restart, update, crash) → nginx gets 502 / 503 → this page, status 503.
#    Only errors nginx makes itself: a 503 Rulezet sends is shown as is (proxy_intercept_errors off),
#    and a slow page (504) keeps its normal error, not "being updated".
#  - Planned maintenance: `bash deploy/nginx_switch.sh maintenance on` creates the flag file below,
#    every request gets the page until `maintenance off`.

error_page 502 503 =503 @rulezet_maintenance;

if (-f /var/www/rulezet-maintenance/on) {
    return 503;
}

location @rulezet_maintenance {
    root /var/www/rulezet-maintenance;
    try_files /maintenance.html =503;
    add_header Retry-After 15 always;
    add_header Cache-Control "no-store" always;
}
